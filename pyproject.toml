[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emotional_budget_tracker"
version = "0.2.0"

[tool.setuptools]
packages = [
    "emotional_budget_tracker",
    "emotional_budget_tracker.api",
    "emotional_budget_tracker.models",
    "emotional_budget_tracker.rituals",
    "emotional_budget_tracker.rituals.core",
    "emotional_budget_tracker.utils",
    "emotional_budget_tracker.prompts",
    "emotional_budget_tracker.inspiration",
]
package-dir = {"emotional_budget_tracker" = "."}
